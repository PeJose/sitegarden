    to: fernhill-repo
    type: webhook
    label: WEBHOOK
  - from: fernhill-repo
    to: fernhill-site
    type: deploy
    label: FTPS
  - from: copperleaf-cms
    to: copperleaf-repo
    type: webhook
    label: WEBHOOK
  - from: copperleaf-repo
    to: copperleaf-site
    type: deploy
    label: FTPS
  - from: notes-cms
    to: notes-repo
    type: webhook
    label: WEBHOOK
  - from: notes-repo
    to: notes-site
    type: deploy
    label: VERCEL
  - from: notes-db
    to: notes-site
    type: sync
    label: SQL
  - from: notes-job
    to: notes-db
    type: sync
    label: CRON
  - from: sedum-job
    to: sedum-site
    type: deploy
    label: FTPS
  - from: sedum-site
    to: sedum-site2
    type: deploy
    label: RSYNC
  - from: juniper-cms
    to: juniper-repo
