# yaml-language-server: $schema=./schema.json
# Sitegarden config: groups, nodes and edges. `pnpm sg plan` shows what would render, `pnpm sg apply` renders it.
world:
  seed: garden-58
plugins:
  - ./plugins/essentials
  - ./plugins/mock
groups:
  - id: fernhill
    label: fernhill
  - id: copperleaf
    label: copperleaf
  - id: notes
    label: notes
  - id: sedum
    label: sedum
  - id: juniper
    label: juniper
  - id: heather
    label: heather
nodes:
  - id: fernhill-cms
    type: cms
    group: fernhill
    name: fernhill-cms
    host: Sanity
    links:
      - label: Sanity manage
        url: https://www.sanity.io/manage/project/fh4abc12
      - label: Studio
        url: https://fernhill.sanity.studio
      - label: Webhooks
        url: https://www.sanity.io/manage/project/fh4abc12/api#webhooks
    notes: Content studio for the Fernhill apartment listings. Publishing fires the deploy webhook.
    checks:
      - type: mock
        every: 1m
    mock:
      checks: []
      baseMs: 0
      initialStatus: ok
  - id: fernhill-repo
    type: repo
    group: fernhill
    name: acme/fernhill
    host: GitHub
    repo: acme/fernhill
    notes: "Astro site. Deploy workflow: deploy.yml on main, uploads over FTPS."
    checks:
      - type: mock
        every: 1m
    mock:
      checks: []
      baseMs: 0
      initialStatus: ok
  - id: fernhill-site
    type: site
    group: fernhill
    name: fernhill.example
    host: host.example
    url: https://fernhill.example
    links:
      - label: host.example panel
        url: https://panel.host.example
    notes: "Runbook: if down, check host.example panel first, then re-run the last green deploy."
    checks:
      - type: mock
        every: 15s
    mock:
      checks:
        - http every 5m, expect 200 + "Fernhill"
        - ssl warn 14d
        - domain warn 30d
      baseMs: 180
      initialStatus: ok
  - id: copperleaf-cms
    type: cms
    group: copperleaf
    name: copperleaf-cms
    host: Sanity
    links:
      - label: Sanity manage
        url: https://www.sanity.io/manage/project/cl4def56
      - label: Studio
        url: https://copperleaf.sanity.studio
      - label: Webhooks
        url: https://www.sanity.io/manage/project/cl4def56/api#webhooks
    notes: Content studio for the Copperleaf catalogue.
    checks:
      - type: mock
        every: 1m
    mock:
      checks: []
      baseMs: 0
      initialStatus: ok
  - id: copperleaf-repo
    type: repo
    group: copperleaf
    name: acme/copperleaf
    host: GitHub
    repo: acme/copperleaf
    notes: Storefront. Workflow deploy.yml on main.
    checks:
      - type: mock
        every: 1m
    mock:
      checks: []
      baseMs: 0
      initialStatus: working
  - id: copperleaf-site
    type: site
    group: copperleaf
    name: copperleaf.example
    host: FTPS
    url: https://copperleaf.example
    links:
      - label: Hosting panel
        url: https://panel.example-host.com
    notes: Slow since the image migration. Look at the origin cache before blaming the code.
    checks:
      - type: mock
        every: 15s
    mock:
      checks:
        - http every 5m, expect 200 + "Copperleaf"
        - ssl warn 14d
        - domain warn 30d
      baseMs: 380
      initialStatus: down
  - id: notes-cms
    type: cms
    group: notes
    name: notes-cms
    host: Sanity
    links:
      - label: Sanity manage
        url: https://www.sanity.io/manage/project/nt7ghi89
      - label: Studio
        url: https://notes.sanity.studio
    notes: Blog posts and newsletter drafts.
    checks:
      - type: mock
        every: 1m
    mock:
      checks: []
      baseMs: 0
      initialStatus: ok
  - id: notes-repo
    type: repo
    group: notes
    name: acme/notes
    host: GitHub
    links:
      - label: Actions
        url: https://github.com/acme/notes/actions
      - label: Secrets
        url: https://github.com/acme/notes/settings/secrets/actions
      - label: Pull requests
        url: https://github.com/acme/notes/pulls
    notes: Next.js blog. deploy.yml on main.
    checks:
      - type: mock
        every: 1m
    mock:
      checks: []
      baseMs: 0
      initialStatus: ok
  - id: notes-db
    type: db
    group: notes
    name: notes-db
    host: Postgres
    links:
      - label: Dashboard
        url: https://example.com/notes/db
    notes: Subscribers and comments.
    checks:
      - type: mock
        every: 1m
    mock:
      checks:
        - tcp 5432 every 5m
      baseMs: 40
      initialStatus: ok
  - id: notes-job
    type: job
    group: notes
    name: newsletter
    host: cron
    links:
      - label: Logs
        url: https://example.com/notes/job
    notes: Sends the weekly newsletter on Mondays, pings a heartbeat.
    checks:
      - type: mock
        every: 1m
    mock:
      checks:
        - heartbeat every 7d, grace 2h
      baseMs: 0
      initialStatus: ok
  - id: notes-site
    type: site
    group: notes
    name: notes.example.dev
    host: Vercel
    url: https://notes.example.dev
    links:
      - label: Vercel
        url: https://vercel.com/dashboard
    notes: Public blog, checked every 5 minutes.
    checks:
      - type: mock
        every: 15s
    mock:
      checks:
        - http every 5m, expect 200
        - ssl warn 14d
      baseMs: 120
      initialStatus: ok
