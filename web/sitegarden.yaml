# Sitegarden config: one estate per project. `pnpm sg plan` shows what would render, `pnpm sg apply` renders it.
accountSeed: garden-58
estates:
  - id: fernhill
    label: fernhill
    nodes:
      - id: fernhill-cms
        type: cms
        name: fernhill-cms
        host: Sanity
        links:
          - label: Sanity manage
            url: https://www.sanity.io/manage/project/fh4abc12
          - label: Studio
            url: https://fernhill.sanity.studio
          - label: Webhooks
            url: https://www.sanity.io/manage/project/fh4abc12/api#webhooks
        notes: Content studio for the Fernhill apartment listings. Publishing fires the deploy webhook.
        checks: []
        baseMs: 0
        initialStatus: ok
      - id: fernhill-repo
        type: repo
        name: acme/fernhill
        host: GitHub
        links:
          - label: Actions
            url: https://github.com/acme/fernhill/actions
          - label: Settings
            url: https://github.com/acme/fernhill/settings
          - label: Secrets
            url: https://github.com/acme/fernhill/settings/secrets/actions
          - label: Pull requests
            url: https://github.com/acme/fernhill/pulls
          - label: Issues
            url: https://github.com/acme/fernhill/issues
        notes: "Astro site. Deploy workflow: deploy.yml on main, uploads over FTPS."
        checks: []
        baseMs: 0
        initialStatus: ok
      - id: fernhill-site
        type: site
        name: fernhill.example
        host: host.example
        links:
          - label: fernhill.example
            url: https://fernhill.example
          - label: host.example panel
            url: https://panel.host.example
        notes: "Runbook: if down, check host.example panel first, then re-run the last green deploy."
        checks:
          - http every 5m, expect 200 + "Fernhill"
          - ssl warn 14d
          - domain warn 30d
        baseMs: 180
        initialStatus: ok
    edges:
      - from: fernhill-cms
        to: fernhill-repo
        type: webhook
        label: WEBHOOK
      - from: fernhill-repo
        to: fernhill-site
        type: deploy
        label: FTPS
  - id: copperleaf
    label: copperleaf
    nodes:
      - id: copperleaf-cms
        type: cms
        name: copperleaf-cms
        host: Sanity
        links:
