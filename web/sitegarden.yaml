        notes: Content studio for the Copperleaf catalogue.
        checks: []
        baseMs: 0
        initialStatus: ok
      - id: copperleaf-repo
        type: repo
        name: acme/copperleaf
        host: GitHub
        links:
          - label: Actions
            url: https://github.com/acme/copperleaf/actions
          - label: Settings
            url: https://github.com/acme/copperleaf/settings
          - label: Secrets
            url: https://github.com/acme/copperleaf/settings/secrets/actions
          - label: Pull requests
            url: https://github.com/acme/copperleaf/pulls
          - label: Issues
            url: https://github.com/acme/copperleaf/issues
        notes: Storefront. Workflow deploy.yml on main.
        checks: []
        baseMs: 0
        initialStatus: working
      - id: copperleaf-site
        type: site
        name: copperleaf.example
        host: FTPS
        links:
          - label: copperleaf.example
            url: https://copperleaf.example
          - label: Hosting panel
            url: https://panel.example-host.com
        notes: Slow since the image migration. Look at the origin cache before blaming the code.
        checks:
          - http every 5m, expect 200 + "Copperleaf"
          - ssl warn 14d
          - domain warn 30d
        baseMs: 380
        initialStatus: down
    edges:
      - from: copperleaf-cms
        to: copperleaf-repo
        type: webhook
        label: WEBHOOK
      - from: copperleaf-repo
        to: copperleaf-site
        type: deploy
        label: FTPS
  - id: notes
    label: notes
    nodes:
      - id: notes-cms
        type: cms
        name: notes-cms
        host: Sanity
        links:
          - label: Sanity manage
            url: https://www.sanity.io/manage/project/nt7ghi89
          - label: Studio
            url: https://notes.sanity.studio
        notes: Blog posts and newsletter drafts.
        checks: []
        baseMs: 0
        initialStatus: ok
      - id: notes-repo
        type: repo
        name: acme/notes
        host: GitHub
        links:
