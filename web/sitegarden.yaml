# Sitegarden config: one estate per project. `pnpm sg plan` shows what would render, `pnpm sg apply` renders it.
accountSeed: garden-58
estates:
  - id: widok23
    label: widok23
    nodes:
      - id: widok23-cms
        type: cms
        name: widok23-cms
        host: Sanity
        links:
          - label: Sanity manage
            url: https://www.sanity.io/manage/project/w23abc12
          - label: Studio
            url: https://widok23.sanity.studio
          - label: Webhooks
            url: https://www.sanity.io/manage/project/w23abc12/api#webhooks
        notes: Content studio for the Widok 23 apartment listings. Publishing fires the deploy webhook.
        checks: []
        baseMs: 0
        initialStatus: ok
      - id: widok23-repo
        type: repo
        name: PeJose/widok23
        host: GitHub
        links:
          - label: Actions
            url: https://github.com/PeJose/widok23/actions
          - label: Settings
            url: https://github.com/PeJose/widok23/settings
          - label: Secrets
            url: https://github.com/PeJose/widok23/settings/secrets/actions
          - label: Pull requests
            url: https://github.com/PeJose/widok23/pulls
          - label: Issues
            url: https://github.com/PeJose/widok23/issues
        notes: "Astro site. Deploy workflow: deploy.yml on main, uploads over FTPS."
        checks: []
        baseMs: 0
        initialStatus: ok
      - id: widok23-site
        type: site
        name: widok23.pl
        host: home.pl
        links:
          - label: widok23.pl
            url: https://widok23.pl
          - label: home.pl panel
            url: https://panel.home.pl
        notes: "Runbook: if down, check home.pl panel first, then re-run the last green deploy."
        checks:
          - http every 5m, expect 200 + "Widok 23"
          - ssl warn 14d
          - domain warn 30d
        baseMs: 180
        initialStatus: ok
    edges:
      - from: widok23-cms
        to: widok23-repo
        type: webhook
        label: WEBHOOK
      - from: widok23-repo
        to: widok23-site
        type: deploy
        label: FTPS
