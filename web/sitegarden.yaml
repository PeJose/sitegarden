          - label: Secrets
            url: https://github.com/acme/notes/settings/secrets/actions
          - label: Pull requests
            url: https://github.com/acme/notes/pulls
        notes: Next.js blog. deploy.yml on main.
        checks: []
        baseMs: 0
        initialStatus: ok
      - id: notes-db
        type: db
        name: notes-db
        host: Postgres
        links:
          - label: Dashboard
            url: https://example.com/notes/db
        notes: Subscribers and comments.
        checks:
          - tcp 5432 every 5m
        baseMs: 40
        initialStatus: ok
      - id: notes-job
        type: job
        name: newsletter
        host: cron
        links:
          - label: Logs
            url: https://example.com/notes/job
        notes: Sends the weekly newsletter on Mondays, pings a heartbeat.
        checks:
          - heartbeat every 7d, grace 2h
        baseMs: 0
        initialStatus: ok
      - id: notes-site
        type: site
        name: notes.example.dev
        host: Vercel
        links:
          - label: notes.example.dev
            url: https://notes.example.dev
          - label: Vercel
            url: https://vercel.com/dashboard
        notes: Public blog, checked every 5 minutes.
        checks:
          - http every 5m, expect 200
          - ssl warn 14d
        baseMs: 120
        initialStatus: ok
    edges:
      - from: notes-cms
        to: notes-repo
        type: webhook
        label: WEBHOOK
      - from: notes-repo
        to: notes-site
        type: deploy
        label: VERCEL
      - from: notes-db
        to: notes-site
        type: sync
        label: SQL
      - from: notes-job
        to: notes-db
        type: sync
        label: CRON
